[env]
GOWORK = "off"

[tasks.deps]
run = "go mod download"

[tasks.build]
run = "go build ./..."

[tasks.test]
description = "Vet Go code and run race-enabled tests"
run = ["go vet ./...", "go test -race -count=1 ./..."]

[tasks.test-postgres]
description = "Test Bloby's PostgreSQL registry"
run = '''
BLOBY_TEST_DATABASE_URL="${BLOBY_TEST_DATABASE_URL:-postgres://goodies:goodies@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 ./pgxstore
'''

[tasks.test-s3]
description = "Test Bloby against the S3 provider named by BLOBY_TEST_S3_*"
run = '''
: "${BLOBY_TEST_S3_ENDPOINT:?set BLOBY_TEST_S3_ENDPOINT, _REGION, _BUCKET, _ACCESS_KEY and _SECRET_KEY}"
go test -race -count=1 -run '^TestS3ProviderInteroperability$' .
'''

[tasks.tidy]
run = "go mod tidy"

[tasks.tidy-check]
run = "go mod tidy -diff"

[tasks.vulncheck]
run = "govulncheck ./..."

[tasks.lint]
run = "golangci-lint run --allow-serial-runners"

[tasks.lint-fix]
run = "golangci-lint run --allow-serial-runners --fix"

[tasks.format]
run = "go fmt ./..."

[tasks.fmt-check]
run = '''
unformatted=$(gofmt -l .) || exit 1
test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
'''
