[tools]
go = "1.27.0"
golangci-lint = "2.13.2"
node = "26.8.1"
pnpm = "12.3.4"
actionlint = "1.7.12"
zizmor = "1.30.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"

[settings]
experimental = true
lockfile = true

[tasks.deps]
run = [
  "go -C auth mod download",
  "go -C bloby mod download",
  "go -C pglock mod download",
  "pnpm install --frozen-lockfile",
]

[tasks.test]
run = ["go test -race -count=1 ./auth/... ./bloby/... ./pglock/...", "pnpm test"]

[tasks.check]
run = [
  { task = "fmt-check" },
  { task = "lint" },
  { task = "test" },
  { task = "test-module" },
  { task = "build" },
  { task = "workflow-lint" },
  { task = "vulncheck" },
]

[tasks.test-module]
run = [
  { task = "test-module-auth" },
  { task = "test-module-bloby" },
  { task = "test-module-pglock" },
]

[tasks.test-module-auth]
dir = "auth"
env.GOWORK = "off"
run = ["go vet ./...", "go test -race -count=1 ./...", "go mod tidy -diff"]

[tasks.test-module-bloby]
dir = "bloby"
env.GOWORK = "off"
run = ["go vet ./...", "go test -race -count=1 ./...", "go mod tidy -diff"]

[tasks.test-module-pglock]
dir = "pglock"
env.GOWORK = "off"
run = ["go vet ./...", "go test -race -count=1 ./...", "go mod tidy -diff"]

[tasks.test-postgres]
run = '''
BLOBY_TEST_DATABASE_URL="${BLOBY_TEST_DATABASE_URL:-postgres://goodies:goodies@127.0.0.1:5432/postgres?sslmode=disable}" \
PGLOCK_TEST_DATABASE_URL="${PGLOCK_TEST_DATABASE_URL:-postgres://goodies:goodies@127.0.0.1:5432/postgres?sslmode=disable}" \
  go test -race -count=1 ./bloby/pgxstore ./pglock
'''

[tasks.build]
run = ["go build ./auth/... ./bloby/... ./pglock/...", "pnpm build"]

[tasks.lint]
run = [{ task = "go-lint" }, "pnpm lint", "pnpm typecheck"]

[tasks.go-lint]
run = "golangci-lint run ./auth/... ./bloby/... ./pglock/..."

[tasks.go-lint-fix]
run = "golangci-lint run --fix ./auth/... ./bloby/... ./pglock/..."

[tasks.format]
run = ["gofmt -w auth bloby pglock", "pnpm format"]

[tasks.fmt-check]
run = ["test -z \"$(gofmt -l auth bloby pglock)\"", "pnpm format:check"]

[tasks.workflow-lint]
run = ["actionlint", "zizmor --min-severity medium --format plain .github/workflows"]

[tasks.vulncheck]
run = [{ task = "vulncheck-auth" }, { task = "vulncheck-bloby" }, { task = "vulncheck-pglock" }]

[tasks.vulncheck-auth]
dir = "auth"
env.GOWORK = "off"
run = "govulncheck ./..."

[tasks.vulncheck-bloby]
dir = "bloby"
env.GOWORK = "off"
run = "govulncheck ./..."

[tasks.vulncheck-pglock]
dir = "pglock"
env.GOWORK = "off"
run = "govulncheck ./..."
