monorepo_root = true

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
node = "26.13.0"
pnpm = "12.17.0"
actionlint = "1.7.12"
zizmor = "1.32.0"
lefthook = "2.2.2"
oxfmt = "0.75.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["auth", "bloby", "pglock", "packages/*"]

[tasks.deps]
depends = ["//auth:deps", "//bloby:deps", "//pglock:deps", "node-deps"]

[tasks.node-deps]
run = "pnpm install --frozen-lockfile"

[tasks.test]
depends = [
  "//auth:test",
  "//bloby:test",
  "//pglock:test",
  "//packages/...:test",
]

[tasks.check]
run = [
  { task = "fmt-check" },
  { task = "lint" },
  { task = "test" },
  { task = "tidy-check" },
  { task = "build" },
  { task = "vulncheck" },
]

[tasks.tidy]
depends = ["//auth:tidy", "//bloby:tidy", "//pglock:tidy"]

[tasks.tidy-check]
depends = ["//auth:tidy-check", "//bloby:tidy-check", "//pglock:tidy-check"]

[tasks.test-postgres]
description = "Test Bloby's registry and advisory locks against PostgreSQL"
depends = ["//bloby:test-postgres", "//pglock:test-postgres"]

[tasks.build]
depends = [
  "//auth:build",
  "//bloby:build",
  "//pglock:build",
  "//packages/...:build",
]

[tasks.lint]
depends = [
  "//auth:lint",
  "//bloby:lint",
  "//pglock:lint",
  "//packages/...:lint",
]

[tasks.lint-fix]
description = "Apply Go lint fixes"
depends = ["//auth:lint-fix", "//bloby:lint-fix", "//pglock:lint-fix"]

[tasks.format]
depends = ["//auth:format", "//bloby:format", "//pglock:format"]
run = ["mise fmt", "oxfmt"]

[tasks.fmt-check]
depends = ["//auth:fmt-check", "//bloby:fmt-check", "//pglock:fmt-check"]
run = ["mise fmt --check", "oxfmt --check"]

[tasks.vulncheck]
depends = ["//auth:vulncheck", "//bloby:vulncheck", "//pglock:vulncheck"]

[hooks]
postinstall = "lefthook install"
