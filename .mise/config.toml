monorepo_root = true

[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
node = "26.8.1"
pnpm = "11.25.0"
actionlint = "1.7.12"
zizmor = "1.30.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"

[settings]
experimental = true
lockfile = true

[monorepo]
config_roots = ["auth", "bloby", "pglock", "packages/*"]

[tasks.deps]
description = "Install Go module and Node workspace dependencies"
depends = ["//auth:deps", "//bloby:deps", "//pglock:deps", "node-deps"]

[tasks.node-deps]
description = "Install Node workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.test]
description = "Test every module and package"
depends = ["//auth:test", "//bloby:test", "//pglock:test", "//packages/...:test"]

[tasks.check]
description = "Check formatting, lint, tests, module metadata, builds, and vulnerabilities"
run = [
  { task = "fmt-check" },
  { task = "lint" },
  { task = "test" },
  { task = "tidy-check" },
  { task = "build" },
  { task = "vulncheck" },
]

[tasks.tidy]
description = "Tidy every Go module"
depends = ["//auth:tidy", "//bloby:tidy", "//pglock:tidy"]

[tasks.tidy-check]
description = "Check every Go module is tidy"
depends = ["//auth:tidy-check", "//bloby:tidy-check", "//pglock:tidy-check"]

[tasks.test-postgres]
description = "Test Bloby's registry and advisory locks against PostgreSQL"
depends = ["//bloby:test-postgres", "//pglock:test-postgres"]

[tasks.build]
description = "Build every module and package"
depends = ["//auth:build", "//bloby:build", "//pglock:build", "//packages/...:build"]

[tasks.lint]
description = "Lint every module and package"
depends = ["//auth:lint", "//bloby:lint", "//pglock:lint", "//packages/...:lint"]

[tasks.lint-fix]
description = "Apply Go lint fixes"
depends = ["//auth:lint-fix", "//bloby:lint-fix", "//pglock:lint-fix"]

[tasks.format]
description = "Format the repository"
depends = ["//auth:format", "//bloby:format", "//pglock:format", "node-deps"]
run = "pnpm run format"

[tasks.fmt-check]
description = "Check repository formatting"
depends = ["//auth:fmt-check", "//bloby:fmt-check", "//pglock:fmt-check", "node-deps"]
run = "pnpm run format:check"

[tasks.vulncheck]
description = "Scan every Go module for known vulnerabilities"
depends = ["//auth:vulncheck", "//bloby:vulncheck", "//pglock:vulncheck"]
