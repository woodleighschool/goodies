name: CI

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  workflow-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Workflow Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Resolve linter versions
        id: tools
        run: |
          echo "actionlint=$(mise config get tools.actionlint)" >> "$GITHUB_OUTPUT"
          echo "zizmor=$(mise config get tools.zizmor)" >> "$GITHUB_OUTPUT"

      - name: Lint workflows
        uses: home-operations/.github/actions/workflow-lint@69cad1e407df8070dd9cfc3314551e473544014e # workflow-lint-v1.0.3
        with:
          actionlint-version: ${{ steps.tools.outputs.actionlint }}
          zizmor-version: ${{ steps.tools.outputs.zizmor }}

  check:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: goodies
          POSTGRES_PASSWORD: goodies
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goodies -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked go golangci-lint node pnpm oxfmt go:golang.org/x/vuln/cmd/govulncheck
      - run: mise run deps
      - run: mise run check
      - run: mise run test-postgres
      - name: Check package contents
        run: pnpm -r exec npm pack --dry-run

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - workflow-lint
      - check
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
