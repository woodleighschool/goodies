name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  check:
    name: Build Success
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_USER: goodies
          POSTGRES_PASSWORD: goodies
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goodies -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          experimental: true
          install_args: --locked go golangci-lint go:golang.org/x/vuln/cmd/govulncheck node pnpm oxfmt jactionlint

      - name: Resolve Go cache
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache.outputs.version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Resolve pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: jactionlint --online --shellcheck= --format github

      - name: Install dependencies
        run: mise run deps

      - name: Check formatting
        run: mise run fmt-check

      - name: Check module tidiness
        run: mise run tidy-check

      - name: Lint modules and packages
        run: mise run lint

      - name: Test modules and packages
        env:
          BLOBY_TEST_DATABASE_URL: postgres://goodies:goodies@localhost:5432/postgres?sslmode=disable
          PGLOCK_TEST_DATABASE_URL: postgres://goodies:goodies@localhost:5432/postgres?sslmode=disable
        run: mise run test

      - name: Build modules and packages
        run: mise run build

      - name: Check vulnerabilities
        run: mise run vulncheck

      - name: Start Garage
        env:
          GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
          GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          GARAGE_DEFAULT_BUCKET: bloby
        run: |
          cat > "$RUNNER_TEMP/garage.toml" <<EOF
          metadata_dir = "/tmp/meta"
          data_dir = "/tmp/data"
          db_engine = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "[::]:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "$(openssl rand -hex 32)"

          [s3_api]
          s3_region = "garage"
          api_bind_addr = "[::]:3900"

          [admin]
          api_bind_addr = "[::]:3903"
          EOF
          docker run --detach --publish 3900:3900 --publish 3903:3903 \
            --volume "$RUNNER_TEMP/garage.toml:/etc/garage.toml:ro" \
            --env GARAGE_DEFAULT_ACCESS_KEY --env GARAGE_DEFAULT_SECRET_KEY --env GARAGE_DEFAULT_BUCKET \
            dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020 /garage server --single-node --default-bucket
          timeout 60 sh -c 'until curl -fsS http://127.0.0.1:3903/health >/dev/null; do sleep 0.5; done'
      - name: Test Bloby against Garage
        env:
          BLOBY_TEST_S3_ENDPOINT: http://127.0.0.1:3900
          BLOBY_TEST_S3_REGION: garage
          BLOBY_TEST_S3_BUCKET: bloby
          BLOBY_TEST_S3_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
          BLOBY_TEST_S3_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: mise run //bloby:test-s3

      - name: Check package contents
        run: pnpm -r exec npm pack --dry-run
