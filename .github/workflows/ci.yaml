name: CI

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  workflow-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Workflow Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false

      - name: Resolve linter versions
        id: tools
        run: |
          echo "actionlint=$(mise config get tools.actionlint)" >> "$GITHUB_OUTPUT"
          echo "zizmor=$(mise config get tools.zizmor)" >> "$GITHUB_OUTPUT"

      - name: Lint workflows
        uses: home-operations/.github/actions/workflow-lint@1d6eebfd2066f2aa84939e573e56f60d8d2ed85f # workflow-lint-v1.0.4
        with:
          actionlint-version: ${{ steps.tools.outputs.actionlint }}
          zizmor-version: ${{ steps.tools.outputs.zizmor }}

  check:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Check
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: goodies
          POSTGRES_PASSWORD: goodies
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goodies -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true
          install_args: --locked go golangci-lint node pnpm oxfmt go:golang.org/x/vuln/cmd/govulncheck
      - run: mise run deps
      - run: mise run check
      - run: mise run test-postgres
      - name: Start Garage
        env:
          GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
          GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          GARAGE_DEFAULT_BUCKET: bloby
        run: |
          cat > "$RUNNER_TEMP/garage.toml" <<EOF
          metadata_dir = "/tmp/meta"
          data_dir = "/tmp/data"
          db_engine = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "[::]:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "$(openssl rand -hex 32)"

          [s3_api]
          s3_region = "garage"
          api_bind_addr = "[::]:3900"

          [admin]
          api_bind_addr = "[::]:3903"
          EOF
          docker run --detach --publish 3900:3900 --publish 3903:3903 \
            --volume "$RUNNER_TEMP/garage.toml:/etc/garage.toml:ro" \
            --env GARAGE_DEFAULT_ACCESS_KEY --env GARAGE_DEFAULT_SECRET_KEY --env GARAGE_DEFAULT_BUCKET \
            dxflrs/garage:v2.4.1 /garage server --single-node --default-bucket
          timeout 60 sh -c 'until curl -fsS http://127.0.0.1:3903/health >/dev/null; do sleep 0.5; done'
      - name: Test Bloby against Garage
        env:
          BLOBY_TEST_S3_ENDPOINT: http://127.0.0.1:3900
          BLOBY_TEST_S3_REGION: garage
          BLOBY_TEST_S3_BUCKET: bloby
          BLOBY_TEST_S3_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
          BLOBY_TEST_S3_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: mise run //bloby:test-s3
      - name: Check package contents
        run: pnpm -r exec npm pack --dry-run

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - workflow-lint
      - check
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
