name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      node-releases: ${{ steps.node-releases.outputs.releases }}
    steps:
      - name: Generate token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Release Please
        uses: release-please-oss/release-please-action@7a6e2d3ff9e08fbd69d0430e4be5d90a3e96c28c # v5.3.2
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Select released Node packages
        id: node-releases
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          releases=$(jq -c '. as $outputs | [
            .paths_released | fromjson | .[]
            | select(startswith("packages/"))
            | {path: ., tag: $outputs[. + "--tag_name"]}
          ]' <<<"$RELEASE_OUTPUTS")
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  publish-node:
    needs: release
    if: ${{ needs.release.outputs.node-releases != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.node-releases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.tag }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm publish
        working-directory: ${{ matrix.path }}
