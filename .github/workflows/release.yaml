name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  package:
    runs-on: ubuntu-26.04
    outputs:
      path: ${{ steps.package.outputs.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Find the Node package for this release
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          path=$(jq -r --arg component "${TAG%/v*}" '.packages | to_entries[]
            | select(.value.component == $component and .value["release-type"] == "node")
            | .key' release-please-config.json)
          echo "path=${path}" >> "$GITHUB_OUTPUT"

  publish-node:
    needs: package
    if: ${{ needs.package.outputs.path != '' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: false
          experimental: true
          install_args: --locked node pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm publish
        working-directory: ${{ needs.package.outputs.path }}
